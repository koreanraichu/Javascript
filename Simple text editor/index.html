<html>
    <head>
        <title>Simple text editor</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/dc58858c96.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="wrapper">
            <h1>매우 심플한 텍스트 에디터</h1>
            <!-- 글꼴 변경용 select 태그-->
            <select id="fonts">
                <option name="editorfont" value='Pretendard-Regular'>프리텐다드 (기본)</option>
                <option name="editorfont" value='NexonMaplestory'>넥슨 메이플스토리</option>
                <option name="editorfont" value='RIDIBatang'>리디바탕</option>
                <option name="editorfont" value='SeochoBatang'>서초바탕</option>
                <option name="editorfont" value='Xcu'>엑큐</option>
                <option name="editorfont" value='MabinogiClassicR'>마비옛체</option>
                <option name="editorfont" value='GeuriunXGukhanbakGeulbangGuri'>그리운X국한박 글방구리체</option>
                <option name="editorfont" value='GeuriunXGukhanbakNatseonSongeul'>그리운X국한박 낯선손글</option>
                <option name="editorfont" value='NostalgicGukhanbakLovely'>그리운X국한박 사랑스러운</option>
                <option name="editorfont" value='NostalgicNaramOfThought'>그리운 나람체</option>
                <option name="editorfont" value='NostalgicGellyRoll'>그리운 겔리롤</option>
                <option name="editorfont" value='NostalgicPopcorn'>그리운 팝콘체</option>
                <option name="editorfont" value='NostalgicDolce'>그리운 돌체</option>
                <option name="editorfont" value='Rimgul'>림굴</option>
                <option name="editorfont" value='Umdot'>움돋</option>
                <option name="editorfont" value='Seogung'>서궁</option>
                <option name="editorfont" value='Tangba'>탕바</option>
                <option name="editorfont" value='ThinMulmaru'>얇은물마루</option>
            </select>
            <!--여기까지임-->
            <input type="file" id="textuploader" accept=".txt">
            <label for="textuploader"><i class="fa-solid fa-upload"></i> 텍스트 파일 업로드</label> 
            <div>
            <input id="title" type="text" autofocus="off" placeholder="여기에 제목을 입력해주세요. 파일명으로 쓸겁니다. 파일은 txt파일로 저장됩니다.">
            <textarea id="textarea"></textarea>
            <p class="count">0</p>
            <button id="save"><i class="fa-solid fa-download"></i></button>
            <button id="reset"><i class="fa-solid fa-arrow-rotate-left"></i></button>
            <button id="broom"><i class="fa-solid fa-broom"></i></button>
            <button id="clipbrd"><i class="fa-solid fa-clipboard-list"></i></button>
            </div>
        </div>
        <div class="copied">
            <p>텍스트가 복사되었습니다!</p>
        </div>
        <div class="broomed">
            <p>줄바꿈 정리가 완료되었습니다!</p>
        </div>
    </body>
    <script src="script.js"></script>
</html>
